<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blogs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Rubik', sans-serif;
      background: #f9f9f9;
    }
 .kriya-blue {
  background-color: #FF6500; /* Orange background now */
  color: #e0e0e0;;
}

    .blog-card {
      perspective: 1000px;
      height: 360px;
      cursor: pointer;
    }
    .blog-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.8s;
      transform-style: preserve-3d;
    }
    .blog-card.flipped .blog-inner {
      transform: rotateY(180deg);
    }
    .blog-front, .blog-back {
      position: absolute;
      text-align: center;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border: 1px solid #ccc;
      border-radius: 10px;
      overflow: hidden;
      background: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
    }
    .blog-front img {
      max-height: 180px;
      width: auto;
      object-fit: contain;
      margin: 2rem 0 1rem 0;
    }
    .blog-back {
      transform: rotateY(180deg);
      background-color: #333;
      color: white;
      text-align: left;
    }
    .blog-back h5 {
      margin-top: 1rem;
    }
    .badge-box {
      position: absolute;
      top: 3px;
      background-color:#0066CC;
      color: white;
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: bold;
    }
    .btn-kriya {
      background-color:#0066CC;
      color: white;
      /* #e0e0e0; */
      border: none;
    }
    .btn-kriya:hover {
      background-color:  #004999;
    }
    @media (max-width: 576px) {
  .blog-card {
    min-height: 400px; /* More breathing space on mobile */
  }
  
}
@media (min-width: 577px) and (max-width: 1199.98px) {
  .blog-card {
    min-height:450px; /* More breathing space on mobile */
    min-width: 250;
  }
}
  </style>
</head>

<body>
  <div class="container py-5">
    <h2 class="text-center fw-bold mb-4" style="color:  #FF6500;">EXPLORE OUR BLOGS</h2>
    <div id="blogsContainer" class="row g-4 justify-content-center">
      <!-- Dynamic blogs will come here -->
    </div>
  </div>

<script>
  const blogFiles = [
  'blogs/blog3/blog.txt',
  'blogs/blog2/blog.txt',
   'blogs/blog1/blog.txt'
];

function parseBlogContent(text) {
  const lines = text.split('\n').map(line => line.trim());
  let title = '', subtitle = '', fullContent = '', firstParagraph = '', paragraphCaptured = false;

  lines.forEach(line => {
    if (line.startsWith('#KIT1')) {
      title = line.replace('#KIT1', '').trim();
    } else if (line.startsWith('#KIT2')) {
      subtitle = line.replace('#KIT2', '').trim();
    } else if (line.startsWith('#IMG')) {
      const imgSrc = line.replace('#IMG', '').trim();
      fullContent += `<img src="${imgSrc}" alt="Blog image" loading="lazy" style="max-width: 100%; margin: 10px 0;">`;
    } else if (line.length > 0) {
      if (!paragraphCaptured) {
        firstParagraph = line;
        paragraphCaptured = true;
      }
      fullContent += `<p>${line}</p>`;
    }
  });

  return { title, subtitle, firstParagraph, fullContent };
}


async function loadBlogs() {
  const container = document.getElementById('blogsContainer');

  for (let file of blogFiles) {
    try {
      const response = await fetch(file);
      const text = await response.text();
      const { title, subtitle, firstParagraph, fullContent } = parseBlogContent(text);

      const blogName = file.split('/')[1]; // extract blog1 from blogs/blog1/blog.txt
      const blogPage = `blogs/${blogName}/blog.html`;
      const coverImage = `blogs/${blogName}/cover.jpg`;
      const totalBlogs = blogFiles.length;
      const blogNumber = (totalBlogs - blogFiles.indexOf(file)).toString().padStart(2, '0');

      const cardHTML = `
        <div class="col-md-4">
          <div class="blog-card" onclick="this.classList.toggle('flipped')">
            <div class="blog-inner">
              <div class="blog-front">
                <div class="badge-box">#${blogNumber}</div>
                <img src="${coverImage}" alt="${title}" loading="lazy">
                <h5 class="fw-bold">${title}</h5>
                <p class="text-muted">${subtitle}</p>
                <button class="btn btn-kriya mt-auto">READ MORE</button>
              </div>
              <div class="blog-back">
                <h5>${title}</h5>
                <div class="blog-content">
                  <p>${firstParagraph}</p>
                </div>
                <a href="${blogPage}" target="_blank" class="btn btn-light mt-auto">READ FULL BLOG ↗</a>
              </div>
            </div>
          </div>
        </div>
      `;

      container.insertAdjacentHTML('beforeend', cardHTML);
    } catch (error) {
      console.error('Error loading blog:', file, error);
    }
  }
}


loadBlogs();

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
