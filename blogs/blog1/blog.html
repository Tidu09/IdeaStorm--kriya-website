<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Full Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Rubik', sans-serif;
      padding: 30px;
    }
    img {
      max-width: 100%;
      margin: 20px 0;
    }
    h1 {
      color: #265098;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI in Classrooms: Shaping the Next Generation with the AI Trident</h1>
    <p><em>How schools can teach students to harness AI effectively</em></p>
    <div id="fullBlogContent"></div>
  </div>

  <script>
    fetch('blog.txt')
      .then(response => response.text())
      .then(text => {
        const lines = text.split('\n').map(line => line.trim());
        let content = '';
        lines.forEach(line => {
          if (line.startsWith('#IMG')) {
            const imgSrc = line.replace('#IMG', '').trim();
            content += `<img src="${imgSrc}" alt="Blog Image">`;
          } else if (!line.startsWith('#KIT1') && !line.startsWith('#KIT2') && line.length > 0) {
            content += `<p>${line}</p>`;
          }
        });
        document.getElementById('fullBlogContent').innerHTML = content;
      });
  </script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
