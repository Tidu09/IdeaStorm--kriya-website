<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loading...</title> <!-- Dynamic title will replace this -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Rubik', sans-serif;
      padding: 30px;
      line-height: 1.8;
      background-color: #f9f9f9;
    }
    h1 {
      color: #265098;
      margin-top: 60px;
      margin-bottom: 20px;
      font-size: 2.5rem;
      font-weight: 700;
    }
    h2 {
      color: #444;
      margin-top: 40px;
      margin-bottom: 10px;
      font-size: 1.75rem;
      font-weight: 600;
    }
     p {
    margin-bottom: 16px; /* Normal paragraph spacing */
    font-size: 1.125rem;
    color: #333;
  }
  p.compact {
    margin-bottom: 8px; /* Smaller margin for compact paragraphs */
  }
    .img-center {
    text-align: center;
    margin: 30px 0;
  }
  .img-center img {
    max-width: 100%;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  }
    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      border-radius: 12px;
    }
 
</style>

</head>
<body>
  <div class="container" id="fullBlogContent">
    <!-- Blog Content will be dynamically loaded here -->
  </div>

<script>
    const blogTxtPath = 'blog.txt'; // Local blog.txt file

    fetch(blogTxtPath)
      .then(response => response.text())
      .then(text => {
        const lines = text.split('\n').map(line => line.trim());
        let content = '';
        let blogTitle = '';
        let insideBoldBlock = false;
        let insideItalicsBlock = false;

        lines.forEach(line => {
          if (line.startsWith('#KIT1')) {
            blogTitle = line.replace('#KIT1', '').trim();
            content += `<h1>${blogTitle}</h1>`;
          } else if (line.startsWith('#KIT2')) {
            const subheading = line.replace('#KIT2', '').trim();
            content += `<h2>${subheading}</h2>`;
          } else if (line.startsWith('#IMG')) {
            const imgPath = line.replace('#IMG', '').trim();
            content += `<div class="img-center"><img src="${imgPath}" alt="Blog Image"></div>`;
          } else if (line.length > 0) {
            let formattedLine = line;
            let pClass = ''; // default no class

            // Handle block bold/italics start/end
            if (formattedLine.startsWith('*') && !insideBoldBlock) {
              insideBoldBlock = true;
              formattedLine = `<strong>` + formattedLine.slice(1);
            } else if (formattedLine.endsWith('*') && insideBoldBlock) {
              insideBoldBlock = false;
              formattedLine = formattedLine.slice(0, -1) + `</strong>`;
            } else if (formattedLine.startsWith('_') && !insideItalicsBlock) {
              insideItalicsBlock = true;
              formattedLine = `<em>` + formattedLine.slice(1);
            } else if (formattedLine.endsWith('_') && insideItalicsBlock) {
              insideItalicsBlock = false;
              formattedLine = formattedLine.slice(0, -1) + `</em>`;
            }

            // Inline bold/italics
            formattedLine = formattedLine
              .replace(/\*(.*?)\*/g, '<strong>$1</strong>')
              .replace(/_(.*?)_/g, '<em>$1</em>');

            // Detect #p1 marker WITH space
            if (formattedLine.includes('#p1 ')) {
              formattedLine = formattedLine.replace('#p1 ', '').trim(); // remove #p1 and space
              pClass = 'compact'; // add compact class
            }

            content += `<p class="${pClass}">${formattedLine}</p>`;
          }
        });

        document.title = blogTitle || "Blog"; // Dynamically set <title>
        document.getElementById('fullBlogContent').innerHTML = content;
      })
      .catch(error => {
        console.error('Failed to load blog:', error);
        document.getElementById('fullBlogContent').innerHTML = "<p>Failed to load blog content.</p>";
      });
</script>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
