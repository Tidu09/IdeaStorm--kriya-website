<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You - Kriya</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f8f9fa;
    }
    .thank-you-box {
      max-width: 600px;
      margin: 5rem auto;
      background: white;
      padding: 3rem;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      text-align: center;
    }
    .btn-kriya {
      background-color: #bc9670;
      color: white;
      border: none;
    }
    .btn-kriya:hover {
      background-color: #a87d5e;
    }
  </style>
</head>
<body>
  <div class="thank-you-box">
    <h2 class="text-success fw-bold">🎉 Thank You for Your Order!</h2>
    <p class="mt-3 fs-5">We’ve received your order and it’s being processed.</p>

    <p class="fs-6 text-muted">Your tracking ID:</p>
    <p id="tracking-id" class="fs-4 fw-bold">Loading...</p>

    <a href="/index.html" class="btn btn-kriya mt-4">🏠 Go to Homepage</a>

    <div class="mt-4">
      <a id="invoice-link" class="btn btn-outline-primary" target="_blank" style="display: none;">
        🧾 Download Invoice
      </a>
    </div>
  </div>

  <script>
    const tracking = sessionStorage.getItem('tracking_id');
    if (tracking) {
      document.getElementById('tracking-id').innerText = tracking;
    } else {
      document.getElementById('tracking-id').innerText = 'Unavailable';
    }

    const invoiceUrl = sessionStorage.getItem('invoice_url');
    if (invoiceUrl) {
      const link = document.getElementById('invoice-link');
      link.href = invoiceUrl;
      link.style.display = 'inline-block';
    }
  </script>
</body>
</html>
