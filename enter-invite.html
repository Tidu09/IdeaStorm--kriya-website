<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter Invite Code - Kriya</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" href="images/kriya_logo_favicon.png" type="image/png">

  <style>
    body {
      font-family: 'Rubik', sans-serif;
      background-color: #f5f5f5; /* Your original background color */
      color: #ffffff; /* White text for contrast */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .invite-container {
      background-color: #1a1a1a; /* Dark background for the box */
      padding: 3rem 2.5rem;
      border-radius: 16px;
      max-width: 550px;
      width: 100%;
      text-align: center;
    }
    .invite-container h2 {
      font-weight: 700;
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    .invite-container p.subtitle {
      color: #b3b3b3; /* Lighter gray for subtitle text */
      margin-bottom: 2rem;
      font-size: 1.1rem;
    }
    .form-control.invite-input {
      background-color: #333333;
      border: 1px solid #555555;
      color: #ffffff;
      padding: 0.9rem 1rem;
      font-size: 1rem;
      text-align: left;
    }
    .form-control.invite-input::placeholder {
      color: #888888;
    }
    .form-control.invite-input:focus {
      background-color: #333333;
      color: #ffffff;
      border-color: #8A2BE2; /* Purple focus color */
      box-shadow: 0 0 0 0.25rem rgba(138, 43, 226, 0.25);
    }
    .btn-kriya-purple {
      background-color: #8A2BE2; /* Bright purple for the button */
      color: white;
      border: none;
      font-weight: 500;
      font-size: 1.1rem;
      padding: 0.9rem 1rem;
      transition: background-color 0.2s ease;
    }
    .btn-kriya-purple:hover {
      background-color: #7b24cc;
    }
    .get-in-touch {
      color: #b3b3b3;
      font-size: 0.9rem;
    }
    .get-in-touch a {
      color: #ffffff;
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="invite-container">
  <h2 class="fw-bold">Thank you for your response to Kriya!</h2>
  <p class="subtitle">Join our waitlist and we'll notify you as soon as access is available.</p>

  <div class="mb-3">
    <input type="text" id="inviteCode" class="form-control invite-input" placeholder="Enter your invite code">
  </div>

  <button class="btn btn-kriya-purple w-100" id="validateBtn">Join Waitlist</button>

  <p class="get-in-touch mt-4">Haven't received a code? <a href="/index.html">Get in Touch</a></p>

  <div id="error-msg" class="text-danger mt-3" style="display:none;"></div>

  <div id="loading-spinner" class="text-primary mt-3" style="display:none;">
    <div class="spinner-border" style="color: #8A2BE2;" role="status">
      <span class="visually-hidden">Validating...</span>
    </div>
  </div>
</div>

<script>
document.getElementById('validateBtn').onclick = async () => {
  const code = document.getElementById('inviteCode').value.trim();
  const errorMsg = document.getElementById('error-msg');
  const spinner = document.getElementById('loading-spinner');

  if (!code) {
    errorMsg.textContent = 'Please enter a code.';
    errorMsg.style.display = 'block';
    return;
  }

  spinner.style.display = 'block';
  errorMsg.style.display = 'none';

  try {
    const res = await fetch(`/api/validate-invite?code=${code}`);
    const data = await res.json();

    if (data.valid) {
      const urlParams = new URLSearchParams(window.location.search);
      const plan = urlParams.get('plan') || 'trial';

      sessionStorage.setItem('inviteCode', code);
      window.location.href = `checkout.html?invite=${code}&plan=${plan}`;
    } else {
      errorMsg.textContent = 'Invalid or expired invite code.';
      errorMsg.style.display = 'block';
      spinner.style.display = 'none';
    }
  } catch (err) {
    errorMsg.textContent = 'Something went wrong. Please try again later.';
    errorMsg.style.display = 'block';
    spinner.style.display = 'none';
  }
};
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
